name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The demo is the picture on the front page, so it has to keep running.
      - run: npm run demo

  # The install has been broken three times and nobody noticed, because every other job tests the
  # library from inside the repository that builds it. This one is a stranger: a directory that is
  # not the repo, a clone with nothing built, and the literal command the README gives a reader.
  # Four blind integration trials died on this exact condition.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and pack, as the README tells a reader to
        run: |
          cd "$GITHUB_WORKSPACE/source"
          npm install
          npm run build
          npm pack -w mocon --pack-destination "$RUNNER_TEMP"
      - name: Install the tarball from outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/stranger"
          cd "$RUNNER_TEMP/stranger"
          npm init -y
          npm install "$RUNNER_TEMP"/mocon-*.tgz @opentelemetry/api
      - name: Import it by name and emit a span
        run: |
          cd "$RUNNER_TEMP/stranger"
          node --input-type=module -e '
            import { codeMode, logTracer } from "mocon";
            const out = [];
            const m = codeMode({
              capabilities: { observes_crossings: "some", unmediated_egress: true, crossing_edge: "invocation", attested: [] },
              tracer: logTracer({ write: (r) => out.push(r) }),
            });
            m.execution.start({ program: "x" }).complete();
            if (out[0]?.name !== "execute_code") throw new Error("no span: " + JSON.stringify(out));
            console.log("installed, imported, emitted");
          '
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The same for Python, from its own stranger directory
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$GITHUB_WORKSPACE/source/packages/python"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -c '
          from mocon import CodeMode, Capabilities
          print("installed, imported")
          '

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      # The book embeds spec/otel-code-mode.md, so a build failure here means the specification
      # moved or was renamed and the site would ship a hole where it used to be.
      - run: mdbook build docs
      # An agent-readable summary of the whole thing, served at /llms.txt.
      - run: cp docs/src/llms.txt docs/book/llms.txt
      - name: Check the specification really was embedded
        run: grep -q 'code_mode.observes_crossings' docs/book/spec.html
