<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="mocon-logo-title">
  <title id="mocon-logo-title">mocon</title>
  <!--
    The one opaque tool call, with the calls inside it visible: three crossings, staggered the way a
    trace draws them, and the last one failed.

    The bars are knocked out of the shape rather than painted white, so they take the colour of
    whatever the mark sits on and it works on a light or a dark page. The failed bar is painted on
    top, inside a slightly larger knockout, which leaves it a thin halo and keeps it legible where
    rose meets teal.
  -->
  <defs>
    <linearGradient id="mocon-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <mask id="mocon-spans">
      <rect width="48" height="48" fill="#fff"/>
      <rect x="11" y="16" width="15" height="5" rx="2.5" fill="#000"/>
      <rect x="15" y="25" width="19" height="5" rx="2.5" fill="#000"/>
      <rect x="27" y="33.4" width="11" height="6.2" rx="3.1" fill="#000"/>
    </mask>
  </defs>
  <rect x="4" y="6" width="40" height="36" rx="11" fill="url(#mocon-teal)" mask="url(#mocon-spans)"/>
  <rect x="28" y="34" width="9" height="5" rx="2.5" fill="#f43f5e"/>
</svg>
