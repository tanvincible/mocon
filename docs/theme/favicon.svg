<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="mocon-logo-title">
  <title id="mocon-logo-title">mocon</title>
  <!--
    The one opaque tool call, with the calls inside it visible: three crossings, staggered the way a
    trace shows them, and the last one failed. That is the whole idea in four rectangles.
  -->
  <rect x="4" y="6" width="40" height="36" rx="10" fill="none" stroke="#0e7490" stroke-width="4"/>
  <rect x="11" y="16" width="15" height="5" rx="2.5" fill="#0891b2"/>
  <rect x="15" y="25" width="19" height="5" rx="2.5" fill="#0891b2"/>
  <rect x="28" y="34" width="9" height="5" rx="2.5" fill="#e11d48"/>
</svg>
